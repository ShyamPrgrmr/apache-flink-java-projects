version: "3.8"

services:
  jobmanager:
    image: flink:1.20.1-java17
    container_name: flink-jobmanager
    hostname: jobmanager

    ports:
      - "8081:8081"

    command: jobmanager

    environment:
      env: cluster
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager

    volumes:
      - ./jobs:/opt/flink/usrlib
      - ./checkpoints:/opt/flink/checkpoints

    depends_on:
      - kafka

  taskmanager_1:
    image: flink:1.20.1-java17
    container_name: flink-taskmanager_1
    hostname: taskmanager_1

    command: taskmanager

    depends_on:
      - jobmanager
      - kafka

    environment:
      env: cluster
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        state.checkpoints.dir: file:///opt/flink/checkpoints

    volumes:
      - ./jobs:/opt/flink/usrlib:ro
      - ./checkpoints:/opt/flink/checkpoints

  taskmanager_2:
    image: flink:1.20.1-java17
    container_name: flink-taskmanager_2
    hostname: taskmanager_2

    command: taskmanager

    depends_on:
      - jobmanager
      - kafka

    environment:
      env: cluster
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - ./jobs:/opt/flink/usrlib:ro
      - ./checkpoints:/opt/flink/checkpoints

  taskmanager_3:
    image: flink:1.20.1-java17
    container_name: flink-taskmanager_3
    hostname: taskmanager_3

    command: taskmanager

    depends_on:
      - jobmanager
      - kafka

    environment:
      env: cluster
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - ./jobs:/opt/flink/usrlib:ro
      - ./checkpoints:/opt/flink/checkpoints


  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka-flink
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  kafka_data: